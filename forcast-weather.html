<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forcast-style.css">
    <script type="module" src="weather-forcast-app.js" defer></script>
    <title>Weather-Forcast</title>
</head>
<body>
    <div id="Top-forcast-part" class="Top-forcast-part">
        <h2>Weather Forecast</h2>
        <p>Predicting the future</p>
    </div>

    <div class="search-box">
        <input id="inputPlace" placeholder="Enter city name">
        <button id="placeSearchButton">Search</button>
    </div>

    <div id="forecast-Days-box" class="forecast-Days-box" hidden>
        <div>
            <h2 id="forecastPlaceName"></h2>
        </div>

        <div class="forecast-cards-container">
            <div class="forecast-card">
                <h3 id="day1Date"></h3>
                <p id="day1Condition"></p>
                <p id="day1Temp"></p>
                <p id="day1Humidity"></p>
                <p id="day1Wind"></p>
            </div>

            <div class="forecast-card">
                <h3 id="day2Date"></h3>
                <p id="day2Condition"></p>
                <p id="day2Temp"></p>
                <p id="day2Humidity"></p>
                <p id="day2Wind"></p>
            </div>

            <div class="forecast-card">
                <h3 id="day3Date"></h3>
                <p id="day3Condition"></p>
                <p id="day3Temp"></p>
                <p id="day3Humidity"></p>
                <p id="day3Wind"></p>
            </div>
        </div>
    </div>

    <div id="navigationBlock" class="navigationBlock">
        <button id="backHomeButton">Back to Current Weather</button>
    </div>

</body>
</html>
